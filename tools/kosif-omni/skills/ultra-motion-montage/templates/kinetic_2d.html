<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} — 2D Kinetic Typography & Motion</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #09090b;
    color: #fafafa;
    font-family: system-ui, -apple-system, sans-serif;
    overflow: hidden;
    width: {{WIDTH}}px;
    height: {{HEIGHT}}px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
  }
  /* Background Canvas */
  #bg-canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
  }
  /* Kinetic Content Container */
  .container {
    position: relative;
    z-index: 2;
    width: 85%;
    max-width: 900px;
    text-align: right;
    display: flex;
    flex-direction: column;
    gap: 32px;
  }
  .tag {
    display: inline-block;
    padding: 10px 24px;
    background: linear-gradient(135deg, #f59e0b, #d97706);
    color: #000;
    font-weight: 800;
    font-size: 24px;
    border-radius: 8px;
    width: fit-content;
    box-shadow: 0 10px 25px rgba(245, 158, 11, 0.4);
  }
  .title-line {
    font-size: 80px;
    font-weight: 900;
    line-height: 1.2;
    overflow: hidden;
  }
  .word-mask {
    display: inline-block;
    overflow: hidden;
    vertical-align: top;
  }
  .word-inner {
    display: inline-block;
    transition: transform 0.1s linear;
  }
  .highlight {
    color: #f59e0b;
    text-shadow: 0 0 35px rgba(245, 158, 11, 0.6);
  }
  .desc {
    font-size: 34px;
    color: #a1a1aa;
    line-height: 1.5;
    font-weight: 500;
  }
  /* Progress Bar */
  .progress-bar {
    position: absolute;
    bottom: 0; left: 0;
    height: 12px;
    background: linear-gradient(90deg, #f59e0b, #ef4444);
    z-index: 10;
  }
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>

<div class="container">
  <div class="tag" id="tag">🚀 موشن غرافيكس فائق</div>
  <div class="title-line" id="title-container">
    {{TITLE}}
  </div>
  <p class="desc" id="desc">
    تصميم حركي سينمائي بفيزياء النوابض وتايبوغرافي عربية متطورة
  </p>
</div>

<div class="progress-bar" id="p-bar"></div>

<script>
const W = {{WIDTH}};
const H = {{HEIGHT}};
const DURATION = {{DURATION}};

const canvas = document.getElementById('bg-canvas');
canvas.width = W;
canvas.height = H;
const ctx = canvas.getContext('2d');

// Split title into animated masked words
const titleContainer = document.getElementById('title-container');
const rawText = titleContainer.innerText.trim();
const words = rawText.split(' ');
titleContainer.innerHTML = '';

const wordElements = words.map((w, idx) => {
  const mask = document.createElement('span');
  mask.className = 'word-mask';
  const inner = document.createElement('span');
  inner.className = 'word-inner' + (idx === 1 ? ' highlight' : '');
  inner.textContent = w + ' ';
  mask.appendChild(inner);
  titleContainer.appendChild(mask);
  return inner;
});

// Particle system
const particles = Array.from({ length: 60 }, () => ({
  x: Math.random() * W,
  y: Math.random() * H,
  size: Math.random() * 4 + 2,
  speedY: Math.random() * 2 + 1,
  color: Math.random() > 0.5 ? '#f59e0b' : '#38bdf8'
}));

// Spring easing formula
function spring(t, b, c, d) {
  const s = 1.70158;
  const p = 0;
  let a = c;
  if ((t /= d) === 1) return b + c;
  return a * Math.pow(2, -10 * t) * Math.sin((t * d - (p / 4)) * (2 * Math.PI) / (d * 0.4)) + c + b;
}

// DETERMINISTIC RENDER FUNCTION
window.render = function(t) {
  const normTime = Math.min(1.0, t / DURATION);

  // 1. Draw dynamic background
  ctx.fillStyle = '#09090b';
  ctx.fillRect(0, 0, W, H);

  // Gradient aura
  const grad = ctx.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, W * 0.7);
  grad.addColorStop(0, 'rgba(245, 158, 11, 0.15)');
  grad.addColorStop(0.5, 'rgba(56, 189, 248, 0.08)');
  grad.addColorStop(1, 'rgba(9, 9, 11, 0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Moving particles
  particles.forEach(p => {
    const py = (p.y - t * 40 * p.speedY) % H;
    const actualY = py < 0 ? py + H : py;
    ctx.beginPath();
    ctx.arc(p.x, actualY, p.size, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = 0.4;
    ctx.fill();
  });
  ctx.globalAlpha = 1.0;

  // 2. Kinetic word animations
  wordElements.forEach((el, idx) => {
    const wordStartTime = 0.3 + (idx * 0.22);
    const wordProgress = Math.max(0, Math.min(1, (t - wordStartTime) / 0.7));
    if (t < wordStartTime) {
      el.style.transform = 'translateY(120%)';
      el.style.opacity = '0';
    } else {
      const ease = 1 - Math.pow(1 - wordProgress, 3);
      el.style.transform = `translateY(${(1 - ease) * 100}%)`;
      el.style.opacity = String(ease);
    }
  });

  // 3. Tag entrance
  const tagEl = document.getElementById('tag');
  const tagProg = Math.max(0, Math.min(1, t / 0.5));
  tagEl.style.transform = `scale(${0.8 + tagProg * 0.2})`;
  tagEl.style.opacity = String(tagProg);

  // 4. Description entrance
  const descEl = document.getElementById('desc');
  const descProg = Math.max(0, Math.min(1, (t - 1.0) / 0.8));
  descEl.style.opacity = String(descProg);
  descEl.style.transform = `translateY(${(1 - descProg) * 30}px)`;

  // 5. Progress bar
  const pBar = document.getElementById('p-bar');
  pBar.style.width = `${normTime * 100}%`;
};

window.__ready = true;
window.render(0);
</script>
</body>
</html>
