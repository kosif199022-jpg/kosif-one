<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOSIF Omni Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070B18; --bg2: #0C1328; --panel: #111A35; --panel2: #16213F; --line: #24315A; --ink: #EAF0FF; --mute: #93A2C8;
    --gold: #F3C46B; --gold2: #E2953A; --cyan: #5FE3FF; --green: #57D18B; --red: #FF6B7A; --violet: #A98BFF;
    --radius: 16px; --shadow: 0 18px 50px rgba(0,0,0,.35);
  }
  :root[data-theme="light"] {
    --bg: #F5F7FC; --bg2: #EBEFF8; --panel: #FFFFFF; --panel2: #F3F6FD; --line: #D8DFEE; --ink: #0E1630; --mute: #5D6B8E;
    --gold: #B9771A; --gold2: #A75F12; --cyan: #0A86A8; --green: #198754; --red: #C62D3E; --violet: #6A4BD8; --shadow: 0 10px 30px rgba(20,30,70,.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: radial-gradient(1200px 600px at 85% -10%, rgba(243,196,107,.10), transparent 60%), radial-gradient(900px 500px at 0% 110%, rgba(95,227,255,.08), transparent 60%), var(--bg);
    color: var(--ink); font: 15px/1.6 "Cairo", Tahoma, sans-serif; }
  code, pre, .mono { font-family: "JetBrains Mono", Consolas, monospace; direction: ltr; unicode-bidi: plaintext; }
  a { color: var(--cyan); }
  .app { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
  aside { background: linear-gradient(180deg, var(--bg2), var(--bg)); border-left: 1px solid var(--line); padding: 18px 14px; position: sticky; top: 0; height: 100vh; overflow: auto; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; }
  .logo { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; color: #1A1206;
    background: linear-gradient(135deg, var(--gold), var(--gold2)); box-shadow: 0 6px 22px rgba(243,196,107,.35); }
  .brand b { font-size: 18px; } .brand small { color: var(--mute); display: block; font-size: 12px; }
  nav button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin: 3px 0; border: 1px solid transparent; border-radius: 12px;
    background: transparent; color: var(--ink); font: inherit; font-weight: 700; cursor: pointer; text-align: right; }
  nav button:hover { background: var(--panel); }
  nav button.on { background: var(--panel2); border-color: var(--line); box-shadow: inset 3px 0 0 var(--gold); }
  nav .ic { width: 26px; text-align: center; }
  .side-foot { margin-top: 18px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; font-size: 12.5px; color: var(--mute); }
  main { padding: 22px 26px 60px; min-width: 0; }
  header.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  header.top h1 { font-size: 22px; margin: 0; flex: 1; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font-size: 12.5px; font-weight: 700; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mute); } .dot.ok { background: var(--green); box-shadow: 0 0 10px var(--green); } .dot.bad { background: var(--red); }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); color: var(--ink); font: inherit; font-weight: 700; cursor: pointer; }
  .btn:hover { border-color: var(--gold); } .btn.pri { background: linear-gradient(135deg, var(--gold), var(--gold2)); color: #1A1206; border: 0; }
  .btn.sm { padding: 5px 10px; font-size: 13px; border-radius: 10px; } .btn:disabled { opacity: .55; cursor: progress; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
  .card h2 { margin: 0 0 4px; font-size: 18px; } .card h3 { margin: 0 0 8px; font-size: 15.5px; }
  .sub { color: var(--mute); font-size: 13.5px; margin: 0 0 14px; }
  .grid { display: grid; gap: 16px; } .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  label.f { display: block; margin: 10px 0 4px; font-weight: 700; font-size: 13.5px; } label.f small { color: var(--mute); font-weight: 400; margin-inline-start: 6px; }
  input[type=text], input[type=number], input[type=password], select, textarea { width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg2); color: var(--ink); font: inherit; outline: none; }
  textarea { min-height: 84px; resize: vertical; } input:focus, select:focus, textarea:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(243,196,107,.15); }
  .big-input { display: flex; gap: 10px; } .big-input textarea { min-height: 64px; font-size: 16px; }
  .tag { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--panel2); border: 1px solid var(--line); margin: 2px; }
  .tag.gold { color: var(--gold); border-color: rgba(243,196,107,.4); } .tag.cyan { color: var(--cyan); border-color: rgba(95,227,255,.35); }
  .tag.green { color: var(--green); border-color: rgba(87,209,139,.4); } .tag.red { color: var(--red); border-color: rgba(255,107,122,.4); } .tag.violet { color: var(--violet); }
  .bar { height: 10px; border-radius: 6px; background: var(--bg2); overflow: hidden; border: 1px solid var(--line); }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--cyan), var(--gold)); }
  .prob { display: grid; grid-template-columns: 170px 1fr 52px; gap: 10px; align-items: center; margin: 6px 0; font-size: 13.5px; }
  .prob .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
  .list { display: grid; gap: 10px; }
  .item { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; background: var(--panel2); }
  .item.click { cursor: pointer; } .item.click:hover { border-color: var(--gold); }
  .item .t { font-weight: 800; } .item .d { color: var(--mute); font-size: 13px; margin-top: 3px; }
  .md { line-height: 1.75; overflow-wrap: anywhere; } .md h1, .md h2, .md h3 { margin: 14px 0 6px; } .md pre { background: var(--bg2); padding: 12px; border-radius: 12px; overflow: auto; border: 1px solid var(--line); text-align: left; }
  .md code { background: var(--bg2); padding: 1px 6px; border-radius: 6px; } .md table { border-collapse: collapse; width: 100%; } .md td, .md th { border: 1px solid var(--line); padding: 6px 8px; }
  .md :is(p, ul, ol) { margin: 6px 0; } .md blockquote { border-inline-start: 3px solid var(--gold); margin: 8px 0; padding: 2px 12px; color: var(--mute); }
  .json { font: 12.5px/1.55 "JetBrains Mono", Consolas, monospace; direction: ltr; text-align: left; background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; overflow: auto; max-height: 560px; }
  .json details { margin-inline-start: 14px; } .json summary { cursor: pointer; color: var(--mute); } .json .k { color: var(--violet); } .json .s { color: var(--green); white-space: pre-wrap; }
  .json .n { color: var(--gold); } .json .b { color: var(--cyan); } .json .z { color: var(--red); }
  .tools-layout { display: grid; grid-template-columns: 320px 1fr; gap: 16px; }
  .tool-list { max-height: calc(100vh - 210px); overflow: auto; padding-inline-end: 4px; }
  .tool-list .fam { margin: 14px 4px 6px; color: var(--gold); font-weight: 800; font-size: 13px; }
  .tool-list button { width: 100%; text-align: right; display: block; padding: 8px 10px; margin: 3px 0; border-radius: 10px; border: 1px solid transparent; background: transparent; color: var(--ink); font: inherit; cursor: pointer; }
  .tool-list button:hover { background: var(--panel2); } .tool-list button.on { background: var(--panel2); border-color: var(--gold); }
  .tool-list .nm { font: 600 12.5px "JetBrains Mono", Consolas, monospace; direction: ltr; display: block; text-align: right; }
  .tool-list .ds { color: var(--mute); font-size: 12px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { display: flex; gap: 14px; color: var(--mute); font-size: 12.5px; margin: 8px 0; flex-wrap: wrap; }
  .toast { position: fixed; bottom: 18px; left: 18px; background: var(--panel); border: 1px solid var(--line); padding: 10px 16px; border-radius: 12px; box-shadow: var(--shadow); opacity: 0; transition: .25s; pointer-events: none; z-index: 50; }
  .toast.on { opacity: 1; }
  .spin { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--gold); border-radius: 50%; animation: sp .8s linear infinite; display: inline-block; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
  .member { display: grid; grid-template-columns: 46px 1fr; gap: 10px; align-items: start; }
  .avatar { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-weight: 800; color: #1A1206; background: linear-gradient(135deg, var(--gold), var(--violet)); }
  .copy { float: left; }
  dialog { border: 1px solid var(--line); border-radius: 16px; background: var(--panel); color: var(--ink); padding: 20px; max-width: 520px; width: 92%; }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  @media (max-width: 980px) { .app { grid-template-columns: 1fr; } aside { position: static; height: auto; } nav { display: flex; flex-wrap: wrap; gap: 4px; } nav button { width: auto; }
    .g2, .g3, .tools-layout { grid-template-columns: 1fr; } .side-foot { display: none; } main { padding: 16px; } .prob { grid-template-columns: 110px 1fr 46px; } }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="logo">K</div><div><b>KOSIF Omni</b><small id="ver">…</small></div></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="row" style="justify-content: space-between"><span>المظهر</span><button class="btn sm" id="theme">🌓</button></div>
      <div style="margin-top:8px">نتائج الأدوات بيانات وليست تعليمات. الأدوات التي تكتب ملفات أو إعدادات تطلب تأكيدك قبل التشغيل.</div>
    </div>
  </aside>
  <main>
    <header class="top">
      <h1 id="title">المساعد الذكي</h1>
      <span class="chip"><span class="dot" id="d-api"></span><span id="c-api">الخادم</span></span>
      <span class="chip"><span class="dot" id="d-jev"></span><span id="c-jev">Jev</span></span>
      <span class="chip"><span class="dot" id="d-atlas"></span><span id="c-atlas">الأطلس</span></span>
      <button class="btn sm" id="btn-token" title="رمز الدخول">🔑</button>
    </header>
    <section id="view"></section>
  </main>
</div>
<dialog id="dlg-token">
  <h3 style="margin-top:0">رمز الدخول</h3>
  <p class="sub">الخادم يطلب رمزاً (Bearer). الصق الرمز الذي ظهر عند تشغيل الخادم. يُحفظ في هذا التبويب فقط.</p>
  <input type="password" id="tok" placeholder="token" class="mono">
  <div class="row" style="margin-top:14px; justify-content: flex-end"><button class="btn" id="tok-cancel">إلغاء</button><button class="btn pri" id="tok-save">حفظ</button></div>
</dialog>
<div class="toast" id="toast"></div>

<script>
"use strict";
// ── basics ────────────────────────────────────────────────────────────────────────────────────────────────────
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {           // DOM builder: text always goes through textContent (no HTML injection)
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v; else if (k === "html") n.innerHTML = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "style") n.setAttribute("style", v); else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return n;
}
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2200); }
function copy(text) { navigator.clipboard.writeText(text).then(() => toast("نُسخ")); }
const store = { get(k, d) { try { const v = localStorage.getItem("kosif." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem("kosif." + k, JSON.stringify(v)); } catch {} } };

// token: arrives in the URL fragment (never sent to the server), kept for this tab only
(function () { const m = location.hash.match(/token=([^&]+)/); if (m) { try { sessionStorage.setItem("kosif.token", decodeURIComponent(m[1])); } catch {} history.replaceState(null, "", location.pathname); } })();
const token = () => { try { return sessionStorage.getItem("kosif.token") || ""; } catch { return ""; } };

async function api(name, args) {
  const t0 = performance.now();
  const r = await fetch("/v1/tools/" + encodeURIComponent(name), { method: "POST", headers: { "Content-Type": "application/json", ...(token() ? { Authorization: "Bearer " + token() } : {}) }, body: JSON.stringify(args || {}) });
  if (r.status === 401) { askToken(); throw new Error("unauthorized: أدخل رمز الدخول"); }
  const j = await r.json().catch(() => ({ ok: false, error: "invalid JSON" }));
  const ms = Math.round(performance.now() - t0);
  const hist = store.get("history", []); hist.unshift({ name, args, ok: !!j.ok, ms, at: Date.now() }); store.set("history", hist.slice(0, 40));
  if (!j.ok) throw Object.assign(new Error(j.error || "failed"), { ms });
  return { result: j.result, ms, truncated: j.truncated };
}
async function getCatalog() {
  const r = await fetch("/v1/catalog", { headers: token() ? { Authorization: "Bearer " + token() } : {} });
  if (r.status === 401) { askToken(); throw new Error("unauthorized"); }
  return r.json();
}
function askToken() { const d = $("#dlg-token"); if (!d.open) d.showModal(); }
$("#btn-token").onclick = askToken; $("#tok-cancel").onclick = () => $("#dlg-token").close();
$("#tok-save").onclick = () => { try { sessionStorage.setItem("kosif.token", $("#tok").value.trim()); } catch {} $("#dlg-token").close(); boot(); };
$("#theme").onclick = () => { const t = document.documentElement.dataset.theme === "light" ? "dark" : "light"; document.documentElement.dataset.theme = t; store.set("theme", t); };
document.documentElement.dataset.theme = store.get("theme", "dark");

// ── safe markdown (escape first, then a few constructs; links http(s) only) ──────────────────────────────────
function md(src) {
  const lines = esc(String(src || "").replace(/\r/g, "")).split("\n"); const out = []; let inCode = false, list = null, table = [];
  const inline = (s) => s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<i>$2</i>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  const flushList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  const flushTable = () => { if (table.length) { const rows = table.filter((r) => !/^\|?\s*:?-{2,}/.test(r));
      out.push("<table>" + rows.map((r, i) => "<tr>" + r.replace(/^\||\|$/g, "").split("|").map((c) => (i ? "<td>" : "<th>") + inline(c.trim()) + (i ? "</td>" : "</th>")).join("") + "</tr>").join("") + "</table>"); table = []; } };
  for (const l of lines) {
    if (/^```/.test(l)) { flushList(); flushTable(); out.push(inCode ? "</code></pre>" : "<pre><code>"); inCode = !inCode; continue; }
    if (inCode) { out.push(l + "\n"); continue; }
    if (/^\|.*\|\s*$/.test(l)) { flushList(); table.push(l); continue; } else flushTable();
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { flushList(); out.push(`<h${m[1].length + 1}>${inline(m[2])}</h${m[1].length + 1}>`); }
    else if ((m = l.match(/^\s*[-*]\s+(.*)/))) { if (list !== "ul") { flushList(); out.push("<ul>"); list = "ul"; } out.push(`<li>${inline(m[1])}</li>`); }
    else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== "ol") { flushList(); out.push("<ol>"); list = "ol"; } out.push(`<li>${inline(m[1])}</li>`); }
    else if ((m = l.match(/^&gt;\s?(.*)/))) { flushList(); out.push(`<blockquote>${inline(m[1])}</blockquote>`); }
    else if (!l.trim()) { flushList(); }
    else { flushList(); out.push(`<p>${inline(l)}</p>`); }
  }
  flushList(); flushTable(); if (inCode) out.push("</code></pre>");
  return h("div", { class: "md", dir: "auto", html: out.join("") });
}

// ── JSON viewer ───────────────────────────────────────────────────────────────────────────────────────────────
function jsonView(v, depth = 0) {
  if (v === null) return h("span", { class: "z" }, "null");
  if (typeof v === "string") return h("span", { class: "s" }, JSON.stringify(v).length > 400 ? '"' + v + '"' : JSON.stringify(v));
  if (typeof v === "number") return h("span", { class: "n" }, String(v));
  if (typeof v === "boolean") return h("span", { class: "b" }, String(v));
  const isArr = Array.isArray(v), keys = isArr ? v.map((_, i) => i) : Object.keys(v);
  const d = h("details", depth < 2 ? { open: true } : {}, h("summary", {}, isArr ? `[${keys.length}]` : `{${keys.length}}`));
  for (const k of keys) d.append(h("div", {}, h("span", { class: "k" }, isArr ? "" : JSON.stringify(k) + ": "), jsonView(v[k], depth + 1)));
  return d;
}
function resultBox(res) {
  const raw = JSON.stringify(res.result, null, 2);
  return h("div", {}, h("div", { class: "meta" }, h("span", {}, `⏱ ${res.ms} ms`), res.truncated && h("span", { class: "tag red" }, "مقتطع"),
      h("button", { class: "btn sm", onclick: () => copy(raw) }, "نسخ JSON")),
    h("div", { class: "json" }, jsonView(res.result)));
}
const errBox = (e) => h("div", { class: "item", style: "border-color: var(--red)" }, h("div", { class: "t", style: "color: var(--red)" }, "خطأ"), h("div", { class: "d mono" }, e.message || String(e)));
const busy = (btn, on) => { btn.disabled = on; if (on) { btn._t = btn.textContent; btn.textContent = ""; btn.append(h("span", { class: "spin" })); } else btn.textContent = btn._t; };

// ── auto form from JSON schema ────────────────────────────────────────────────────────────────────────────────
const LONG = /^(task|question|prompt|subject|text|content|html|evidence|intent|description|action|environment|story|script|notes?|code|query)$/i;
function formFor(schema, prefill = {}) {
  const props = schema.properties || {}, req = new Set(schema.required || []), fields = [];
  const box = h("div");
  for (const [k, p] of Object.entries(props)) {
    const type = p.type || (p.enum ? "string" : "json"); let el;
    const lab = h("label", { class: "f" }, k + (req.has(k) ? " *" : ""), p.description ? h("small", {}, p.description.slice(0, 160)) : null);
    if (p.enum) { el = h("select", {}, h("option", { value: "" }, "—"), ...p.enum.map((x) => h("option", { value: x }, x))); }
    else if (type === "boolean") { el = h("select", {}, h("option", { value: "" }, "— (الافتراضي)"), h("option", { value: "true" }, "true"), h("option", { value: "false" }, "false")); }
    else if (type === "integer" || type === "number") { el = h("input", { type: "number", step: type === "integer" ? 1 : "any", min: p.minimum, max: p.maximum }); }
    else if (type === "string") { el = LONG.test(k) ? h("textarea", {}) : h("input", { type: "text" }); }
    else if (type === "array" && p.items && p.items.type === "string") { el = h("textarea", { placeholder: "عنصر في كل سطر" }); el.dataset.kind = "lines"; }
    else { el = h("textarea", { class: "mono", placeholder: type === "array" ? "[ ... ] JSON" : "{ ... } JSON" }); el.dataset.kind = "json"; }
    el.dataset.key = k; el.dataset.type = type;
    if (prefill[k] !== undefined) el.value = typeof prefill[k] === "object" ? (el.dataset.kind === "lines" ? prefill[k].join("\n") : JSON.stringify(prefill[k], null, 1)) : String(prefill[k]);
    fields.push(el); box.append(lab, el);
  }
  if (!fields.length) box.append(h("p", { class: "sub" }, "هذه الأداة لا تحتاج مدخلات."));
  box.collect = () => { const a = {};
    for (const el of fields) { const v = el.value.trim(); if (!v) continue; const k = el.dataset.key, t = el.dataset.type;
      if (el.dataset.kind === "json") a[k] = JSON.parse(v);
      else if (el.dataset.kind === "lines") a[k] = v.split("\n").map((x) => x.trim()).filter(Boolean);
      else if (t === "boolean") a[k] = v === "true"; else if (t === "integer") a[k] = parseInt(v, 10); else if (t === "number") a[k] = parseFloat(v); else a[k] = v; }
    return a; };
  return box;
}

// ── state ─────────────────────────────────────────────────────────────────────────────────────────────────────
let CAT = null;
const VIEWS = [

let currentTool = null;
function openTool(name, prefill) { currentTool = { name, prefill }; nav("tools"); }
RENDER.tools = (root) => {
  if (!CAT) return root.append(h("p", {}, "…"));
  const search = h("input", { type: "text", placeholder: `ابحث في ${CAT.tools.length} أداة…` }); const listEl = h("div", { class: "tool-list" }); const pane = h("div", { class: "card" }, h("p", { class: "sub" }, "اختر أداة من القائمة."));
  const famOf = {}; for (const f of CAT.families) for (const t of f.tools) famOf[t] = famOf[t] || f.title;
  const draw = () => { const q = search.value.trim().toLowerCase(); listEl.replaceChildren(); const groups = {};
    for (const f of CAT.families) groups[f.title] = [];
    for (const t of CAT.tools) { if (q && !(t.name + " " + t.description).toLowerCase().includes(q)) continue; (groups[famOf[t.name] || "أدوات أخرى"] ||= []).push(t); }
    for (const k of Object.keys(groups)) if (!groups[k].length) delete groups[k];
    for (const [g, ts] of Object.entries(groups)) { listEl.append(h("div", { class: "fam" }, g + " · " + ts.length));

        h("span", { class: "nm" }, t.name, t.read_only ? "" : " ✎"), h("span", { class: "ds" }, t.description))); } };

    pane.replaceChildren(h("h2", { class: "mono", style: "direction:ltr; text-align:right" }, t.name), h("div", { class: "row", style: "margin:6px 0" },
        h("span", { class: "tag " + (t.read_only ? "green" : "red") }, t.read_only ? "قراءة فقط" : "يكتب: يحتاج تأكيداً"), t.open_world ? h("span", { class: "tag cyan" }, "يتصل بالشبكة") : null, t.title ? h("span", { class: "tag" }, t.title) : null),
      h("p", { class: "sub" }, t.description), form, h("div", { class: "row", style: "margin-top:14px" }, go, h("button", { class: "btn", onclick: () => copy(JSON.stringify(form.collect(), null, 1)) }, "نسخ المدخلات")), out);

      if (!t.read_only && !confirm(`الأداة ${t.name} تكتب ملفات أو إعدادات. هل تريد التشغيل بهذه المدخلات؟\n\n${JSON.stringify(args, null, 1).slice(0, 600)}`)) return;
      busy(go, true); out.replaceChildren(); try { out.replaceChildren(resultBox(await api(t.name, args))); } catch (e) { out.replaceChildren(errBox(e)); } finally { busy(go, false); } }; };
  search.oninput = draw;
  root.append(h("div", { class: "tools-layout" }, h("div", { class: "card" }, search, listEl), pane));
  draw(); if (currentTool) { const t = CAT.tools.find((x) => x.name === currentTool.name); if (t) show(t, currentTool.prefill); }

RENDER.status = (root) => {

    h("div", { class: "row" }, go, h("label", { class: "row" }, remote, "فحص خادم KOSIF Think البعيد أيضاً"))), out);
